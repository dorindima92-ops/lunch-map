<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта ланчів Харкова</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --btn: var(--tg-theme-button-color, #e8590c);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f3f3f3);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; padding: 8px 10px;
    display: flex; gap: 8px; overflow-x: auto; background: var(--bg);
    box-shadow: 0 1px 4px rgba(0,0,0,.15); scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 0; border-radius: 16px; padding: 6px 12px; font-size: 14px;
    background: var(--card); color: var(--text); cursor: pointer; }
  .chip.on { background: var(--btn); color: var(--btn-text); }
  #map { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; }
  #me { position: absolute; right: 12px; bottom: 24px; z-index: 1001; width: 48px; height: 48px;
    border-radius: 50%; border: 0; background: var(--bg); color: var(--text); font-size: 22px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; transition: bottom .2s; }
  #me.busy { opacity: .6; }
  body.near-open #me { bottom: calc(45vh + 12px); }
  #near { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; max-height: 45vh;
    background: var(--bg); border-radius: 14px 14px 0 0; box-shadow: 0 -2px 10px rgba(0,0,0,.2);
    display: none; flex-direction: column; }
  body.near-open #near { display: flex; }
  #near .hd { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px;
    font-weight: 600; }
  #near .hd button { border: 0; background: none; color: var(--hint); font-size: 20px; cursor: pointer; }
  #near ul { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; }
  #near li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 10px; cursor: pointer; }
  #near li:active { background: var(--card); }
  #near .nm { font-weight: 600; } #near .ds { color: var(--hint); font-size: 13px; }
  #near .km { flex: 0 0 auto; color: var(--btn); font-weight: 600; font-size: 14px; }
  #toast { position: absolute; left: 16px; right: 16px; top: 60px; z-index: 1002; display: none;
    background: #fff3cd; color: #664d03; padding: 10px 12px; border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.2); font-size: 14px; }
  .pop h3 { margin: 0 0 2px; font-size: 16px; }
  .pop .d { color: #777; font-size: 13px; margin-bottom: 8px; }
  .pop a.b { display: block; text-align: center; text-decoration: none; border-radius: 8px;
    padding: 8px 10px; margin-top: 6px; font-weight: 600; }
  .pop a.menu { background: #e8590c; color: #fff; }
  .pop a.route { background: #eee; color: #222; }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: #e8590c; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin span { display: block; transform: rotate(45deg); text-align: center; line-height: 22px; font-size: 13px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="map"></div>
<div id="toast"></div>
<div id="near"><div class="hd"><span>📍 Поруч з вами</span><button id="nearClose" aria-label="Закрити">✕</button></div><ul id="nearList"></ul></div>
<button id="me" title="Де я">📍</button>
<script>
const BOT = "lunch_Kharkiv_bot";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const map = L.map("map", { zoomControl: false }).setView([49.99, 36.25], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap"
}).addTo(map);

const icon = L.divIcon({ className: "", html: '<div class="pin"><span>🍽</span></div>',
  iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

let toastTimer = null;
function toast(msg, ms) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, ms || 5000);
}

function openMenu(id) {
  const link = "https://t.me/" + BOT + "?start=r_" + id;
  if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); try { tg.close(); } catch (e) {} }
  else { window.location.href = link; }
}
window.openMenu = openMenu;

let places = [], markers = [], current = "Усі", lastShown = [], me = null, meMarker = null;

function dist(a, b) {  // метри між двома точками
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmt(m) { return m < 1000 ? Math.round(m / 10) * 10 + " м" : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace(".", ",") + " км"; }

function popupHtml(p) {
  const d = me ? " · " + fmt(dist(me, [p.lat, p.lon])) : "";
  return '<div class="pop"><h3>' + esc(p.name) + '</h3><div class="d">' + esc(p.district) + d + '</div>' +
    '<a class="b menu" href="#" onclick="openMenu(\'' + esc(p.id) + '\');return false;">🍜 Показати меню</a>' +
    (p.maps ? '<a class="b route" href="' + esc(p.maps) + '" target="_blank" rel="noopener">🧭 Маршрут</a>' : '') + '</div>';
}

function render() {
  markers.forEach(m => map.removeLayer(m.marker)); markers = [];
  const shown = places.filter(p => current === "Усі" || p.district === current);
  shown.forEach(p => {
    const marker = L.marker([p.lat, p.lon], { icon }).addTo(map).bindPopup(() => popupHtml(p));
    markers.push({ p, marker });
  });
  lastShown = shown;
  fit();
}

function fit() {
  map.invalidateSize();
  if (lastShown.length) map.fitBounds(L.latLngBounds(lastShown.map(p => [p.lat, p.lon])), { padding: [30, 30], maxZoom: 15 });
}
// Telegram розгортає вікно не одразу: перераховуємо розмір і масштаб, коли воно змінюється
window.addEventListener("resize", () => setTimeout(() => map.invalidateSize(), 200));
if (tg && tg.onEvent) tg.onEvent("viewportChanged", e => { if ((!e || e.isStateStable) && !me) setTimeout(fit, 100); });

function buildBar() {
  const bar = document.getElementById("bar");
  const districts = ["Усі"].concat([...new Set(places.map(p => p.district))]);
  districts.forEach(d => {
    const b = document.createElement("button");
    b.className = "chip" + (d === current ? " on" : ""); b.textContent = d;
    b.onclick = () => { current = d; [...bar.children].forEach(x => x.classList.toggle("on", x === b)); render(); if (me) showNear(false); };
    bar.appendChild(b);
  });
}

fetch("places.json?v=" + Date.now()).then(r => r.json()).then(data => {
  places = data; buildBar(); render(); setTimeout(fit, 400);
}).catch(() => toast("Не вдалося завантажити список закладів. Спробуйте пізніше.", 10000));

// ---------- Геолокація ----------
function showNear(zoom) {
  const pool = places.filter(p => current === "Усі" || p.district === current)
    .map(p => ({ p, m: dist(me, [p.lat, p.lon]) })).sort((a, b) => a.m - b.m).slice(0, 8);
  const ul = document.getElementById("nearList"); ul.innerHTML = "";
  pool.forEach(({ p, m }) => {
    const li = document.createElement("li");
    li.innerHTML = '<div><div class="nm">' + esc(p.name) + '</div><div class="ds">' + esc(p.district) + '</div></div><div class="km">' + fmt(m) + '</div>';
    li.onclick = () => {
      const mk = markers.find(x => x.p === p);
      map.setView([p.lat, p.lon], 16);
      if (mk) setTimeout(() => mk.marker.openPopup(), 250);
    };
    ul.appendChild(li);
  });
  document.body.classList.add("near-open");
  setTimeout(() => {
    map.invalidateSize();
    if (zoom && pool.length) {
      const pts = [me].concat(pool.slice(0, 3).map(x => [x.p.lat, x.p.lon]));
      map.fitBounds(L.latLngBounds(pts), { padding: [40, 40], maxZoom: 16 });
    }
  }, 50);
}
document.getElementById("nearClose").onclick = () => { document.body.classList.remove("near-open"); setTimeout(() => map.invalidateSize(), 50); };

function gotLocation(lat, lon) {
  setBusy(false);
  me = [lat, lon];
  if (meMarker) map.removeLayer(meMarker);
  meMarker = L.circleMarker(me, { radius: 9, color: "#fff", weight: 3, fillColor: "#1e88e5", fillOpacity: 1 })
    .addTo(map).bindPopup("Ви тут");
  showNear(true);
}

function setBusy(b) { const el = document.getElementById("me"); el.classList.toggle("busy", b); el.textContent = b ? "⏳" : "📍"; }

function askSettings(lm) {
  const msg = "Немає доступу до геолокації. Відкрити налаштування і дозволити?";
  if (tg && tg.showConfirm) tg.showConfirm(msg, ok => { if (ok) lm.openSettings(); });
  else toast("Дозвольте доступ до геолокації в налаштуваннях Telegram.");
}

// Запасний варіант — геолокація браузера
function browserGeo(highAccuracy) {
  if (!navigator.geolocation) { setBusy(false); toast("Ваш пристрій не дає визначити місцезнаходження."); return; }
  setBusy(true);
  navigator.geolocation.getCurrentPosition(
    pos => gotLocation(pos.coords.latitude, pos.coords.longitude),
    err => {
      if (err.code === 3 && highAccuracy !== false) return browserGeo(false);  // таймаут — пробуємо без GPS
      setBusy(false);
      if (err.code === 1) toast("Доступ до геолокації заборонено. Дозвольте його для Telegram у налаштуваннях телефону і спробуйте ще раз.", 8000);
      else toast("Не вдалося визначити місцезнаходження. Перевірте, що геолокація на телефоні увімкнена.", 8000);
    },
    { enableHighAccuracy: highAccuracy !== false, timeout: highAccuracy !== false ? 12000 : 20000, maximumAge: 60000 }
  );
}

// Основний варіант — LocationManager Telegram (Bot API 8.0+), якщо клієнт його підтримує
function locate() {
  setBusy(true);
  const lm = tg && tg.LocationManager;
  const supported = lm && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0");
  if (!supported) return browserGeo(true);
  const go = () => {
    if (!lm.isLocationAvailable) return browserGeo(true);
    lm.getLocation(loc => {
      if (loc && typeof loc.latitude === "number") return gotLocation(loc.latitude, loc.longitude);
      setBusy(false);
      if (lm.isAccessRequested && !lm.isAccessGranted) askSettings(lm);
      else browserGeo(true);
    });
  };
  try { lm.isInited ? go() : lm.init(go); } catch (e) { browserGeo(true); }
}
document.getElementById("me").onclick = locate;
</script>
</body>
</html>

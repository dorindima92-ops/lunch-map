<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта ланчів Харкова</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --btn: var(--tg-theme-button-color, #e8590c);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f3f3f3);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; padding: 8px 10px;
    display: flex; gap: 8px; overflow-x: auto; background: var(--bg);
    box-shadow: 0 1px 4px rgba(0,0,0,.15); scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 0; border-radius: 16px; padding: 6px 12px; font-size: 14px;
    background: var(--card); color: var(--text); cursor: pointer; }
  .chip.on { background: var(--btn); color: var(--btn-text); }
  #map { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; }
  #me { position: absolute; right: 12px; bottom: 24px; z-index: 1000; width: 44px; height: 44px;
    border-radius: 50%; border: 0; background: var(--bg); color: var(--text); font-size: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; }
  .pop h3 { margin: 0 0 2px; font-size: 16px; }
  .pop .d { color: #777; font-size: 13px; margin-bottom: 8px; }
  .pop a.b { display: block; text-align: center; text-decoration: none; border-radius: 8px;
    padding: 8px 10px; margin-top: 6px; font-weight: 600; }
  .pop a.menu { background: #e8590c; color: #fff; }
  .pop a.route { background: #eee; color: #222; }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: #e8590c; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .pin span { display: block; transform: rotate(45deg); text-align: center; line-height: 22px; font-size: 13px; }
  #err { position: absolute; top: 60px; left: 16px; right: 16px; z-index: 1001; display: none;
    background: #fff3cd; color: #664d03; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="map"></div>
<div id="err"></div>
<button id="me" title="Де я">📍</button>
<script>
const BOT = "lunch_Kharkiv_bot";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const map = L.map("map", { zoomControl: false }).setView([49.99, 36.25], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap"
}).addTo(map);

const icon = L.divIcon({ className: "", html: '<div class="pin"><span>🍽</span></div>',
  iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24] });

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function openMenu(id) {
  const link = "https://t.me/" + BOT + "?start=r_" + id;
  if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); try { tg.close(); } catch (e) {} }
  else { window.location.href = link; }
}
window.openMenu = openMenu;

let markers = [], current = "Усі";

function render(places) {
  markers.forEach(m => map.removeLayer(m)); markers = [];
  const shown = places.filter(p => current === "Усі" || p.district === current);
  shown.forEach(p => {
    const html = '<div class="pop"><h3>' + esc(p.name) + '</h3><div class="d">' + esc(p.district) + '</div>' +
      '<a class="b menu" href="#" onclick="openMenu(\'' + esc(p.id) + '\');return false;">🍜 Показати меню</a>' +
      (p.maps ? '<a class="b route" href="' + esc(p.maps) + '" target="_blank" rel="noopener">🧭 Маршрут</a>' : '') + '</div>';
    markers.push(L.marker([p.lat, p.lon], { icon }).addTo(map).bindPopup(html));
  });
  if (shown.length) map.fitBounds(L.latLngBounds(shown.map(p => [p.lat, p.lon])), { padding: [40, 40], maxZoom: 15 });
}

function buildBar(places) {
  const bar = document.getElementById("bar");
  const districts = ["Усі"].concat([...new Set(places.map(p => p.district))]);
  districts.forEach(d => {
    const b = document.createElement("button");
    b.className = "chip" + (d === current ? " on" : ""); b.textContent = d;
    b.onclick = () => { current = d; [...bar.children].forEach(x => x.classList.toggle("on", x === b)); render(places); };
    bar.appendChild(b);
  });
}

fetch("places.json?v=" + Date.now()).then(r => r.json()).then(places => {
  buildBar(places); render(places);
}).catch(() => {
  const e = document.getElementById("err"); e.style.display = "block";
  e.textContent = "Не вдалося завантажити список закладів. Спробуйте пізніше.";
});

let meMarker = null;
document.getElementById("me").onclick = () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#1e88e5", fillOpacity: 1 }).addTo(map);
    map.setView(ll, 15);
  }, () => {}, { enableHighAccuracy: true, timeout: 10000 });
};
</script>
</body>
</html>
